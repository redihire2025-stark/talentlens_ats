[build]
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# rewrite-bullet.ts and parse-resume-ai.ts read OPENAI_API_KEY (a server-side Netlify environment
# variable, NOT a VITE_* one) — see docs/architecture/overview.md's "AI
# Layer" section for why the key must never be a VITE_* variable.

# Single-page app: let client-side view state handle unknown paths
# instead of Netlify's default 404 for anything but "/".
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
